<!DOCTYPE html>
<html lang="en">
<head>
    <title>CANINECRYPT</title>
    <meta charset="UTF-8">

    <link rel="icon" href="images/style/skullfavicon.png" type="image/gif">
    <style>
         body,
html {
    height: 100%;
    overflow: hidden;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.background {
    background-image: url('https://rivendell.neocities.org/backgrounds/graph_paper.png');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.8;
    height: 150vh;
    width: 100vw;
    overflow: hidden;
}

.wrapper {
    max-width: 100vw;
    max-height: 100vh;
    overflow-y: hidden;
    /*change to scroll if u want to see the whole image again*/
    overflow-x: hidden;
}

.logo {
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 450px;
    height: auto;
}

.button-container {
    position: fixed;
    top: 35%;
    left: 50%;
    transform: translate(-50%, 0);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.button-container a img {
    width: 250px;
    height: auto;
    transition: transform 0.3s ease;
}

.button-container a img:hover {
    transform: scale(1.1);
}

@media (max-width: 480px) {
    .logo {
        left: 50%;
        width: 95%;
        height: 9vh;
    }

    .button-container {
        left: 50%;
    }

    .background {
        background-position: left;
    }
}
    </style>
</head>

<body>
    <audio id="click">
        <source src="https://files.catbox.moe/gv6ffo.mp3">

    <div class="wrapper">

                        alt="misc"></a>
