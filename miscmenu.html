<!DOCTYPE html>
<html lang="en">
<head>
    <title>CANINECRYPT</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/style/skullfavicon.png" type="image/gif">
    <style>
        body,
        html {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .background {
            background-image: url('https://rivendell.neocities.org/backgrounds/graph_paper.png');
            background-position: center;
            opacity: 0.9;
            height: 150vh;
            width: 100vw;
        }

        .wrapper {
            max-width: 100vw;
            max-height: 100vh;
            overflow-y: scroll;
            /*change to scroll if u want to see the whole image again*/
            overflow-x: hidden;
        }

        .center-image {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: auto;
        }

        .button-container {
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translate(-50%, 0);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .button-container a img {
            width: 250px;
            height: auto;
            margin-top: -70px;
            transition: transform 0.3s ease;
        }

        .button-container a:first-child img {
            margin-top: 0;
        }

        .button-container a img:hover {
            transform: scale(1.1);
        }

        /* MOBILE-ONLY STYLES */
        @media (max-width: 768px) {
            .center-image {
                left: 50%;
            }

            .button-container {
                left: 50%;
            }

            .background {
                background-position: left;
            }
        }

        .divtest {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
        }

        .flex-container {
            display: flex;
            flex-wrap: nowrap;
            background-color: aliceblue;
            padding: 2px;
            margin: 20px;
        }
    </style>
</head>

<body>
    <audio id="click">
        <source src="https://files.catbox.moe/gv6ffo.mp3">
    </audio>
    <div class="wrapper">
        <div class="background"></div>
    </div>
    <img src="buttons/CClogo.png" class="center-image">
    <div class="button-container">
        <div class="divtest">
            <div class="flex-container">
                <a onmouseover="document.getElementById('click').play()" href="404.html"><img src="https://see.fontimg.com/api/rf5/vywD/MzY0YTY0N2IyYzkxNDJlMGIwYjcxYmM3MmM4OWYwNTgudHRm/dXBkYXRlIGxvZw/broken-15.png?r=fs&h=65&w=1000&fg=000000&bg=FFFFFF&tb=1&s=65"
                        alt="misc"></a>
            </div>
            <div class="flex-container">
                <a onmouseover="document.getElementById('click').play()" href="404.html"><img src="https://see.fontimg.com/api/rf5/vywD/MzY0YTY0N2IyYzkxNDJlMGIwYjcxYmM3MmM4OWYwNTgudHRm/d3JpdGluZ3M/broken-15.png?r=fs&h=65&w=1000&fg=000000&bg=FFFFFF&tb=1&s=65"
                        alt="misc"></a>
            </div>
            <div class="flex-container">
                <a onmouseover="document.getElementById('click').play()" href="404.html"><img src="https://see.fontimg.com/api/rf5/vywD/MzY0YTY0N2IyYzkxNDJlMGIwYjcxYmM3MmM4OWYwNTgudHRm/ZmF2b3VpdGVzLi4u/broken-15.png?r=fs&h=65&w=1000&fg=000000&bg=FFFFFF&tb=1&s=65"
                        alt="misc"></a>
            </div>
            <br>
            <div class="flex-container">
                <a onmouseover="document.getElementById('click').play()" href="index.html"><img src="https://assets.propertyshelf.com/web-graphics/click-buttons/back-button.png/image"
                        alt="misc"></a>
            </div>
        </div>
    </div> 
</body>
</html>
