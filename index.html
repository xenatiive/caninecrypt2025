<!DOCTYPE html>
<html lang="en">
<head>
  <title>CANINECRYPT</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/style/skullfavicon.png" type="image/gif">
  <style>
    body, html {
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .background {
      background-image: url('images/gallery/full/skunktoncover.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.8;
      height: 150vh;
      width: 100vw;
      overflow: hidden;
    }

    .wrapper {
      max-width: 100vw;
      max-height: 100vh;
      overflow-y: hidden; /*change to scroll if u want to see the whole image again*/
      overflow-x: hidden;
    }

    .center-image {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      height: auto;
    }

    .button-container {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, 0);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .button-container a img {
      width: 250px;
      height: auto;
      margin-top: -70px;
      transition: transform 0.3s ease;
    }

    .button-container a:first-child img {
      margin-top: 0;
    }

    .button-container a img:hover {
      transform: scale(1.1);
    }

    /* MOBILE-ONLY STYLES */
    @media (max-width: 480px) {
      .center-image {
        left: 50%;
        width: 95%;
        height: 9vh; 
      }

      .button-container {
        left: 50%;
      }

      .background {
        background-position: left;
      }
    }
  </style>
</head>

<body>
  <audio id="click">
    <source src="https://files.catbox.moe/gv6ffo.mp3">
  </audio>
  <div class="wrapper">
    <div class="background"></div>
  </div>
  <img
    src="buttons/CClogo.png" class="center-image">
  <div class="button-container">
    <a onmouseover="document.getElementById('click').play()" href="about.html"><img
        src="buttons/about.png"
        alt="about"/></a>
    <BR><BR><BR><BR><a onmouseover="document.getElementById('click').play()" href="enter.html"><img
        src="buttons/gallery.png"
        alt="gallery"/></a>
    <BR><BR><BR><a onmouseover="document.getElementById('click').play()" href="commissions.html"><img
        src="buttons/commissions.png"
        alt="commissions"/></a>
    <BR><BR><BR><BR><BR><a onmouseover="document.getElementById('click').play()" href="404.html"><img
        src="buttons/misc.png"
        alt="misc"></a>
  </div>
</body>
</html>
