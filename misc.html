<!DOCTYPE html>
<html lang="en">
<head>
    <title>CANINECRYPT</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/style/skullfavicon.png" type="image/gif">
    <style>
body,
html {
    overflow: hidden;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.background {
    background-image: url('../images/style/graph_paper.png');
    background-position: center;
    opacity: 0.6;
    height: 150vh;
    width: 100vw;
    overflow: hidden;
}

.wrapper {
    max-width: 100vw;
    max-height: 100vh;
    overflow-y: hidden;
    overflow-x: hidden;
}

.logo {
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 450px;
    height: auto;
}

.button-container {
    position: fixed;
    top: 35%;
    left: 50%;
    transform: translate(-50%, 0);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.button-container a img {
    width: 250px;
    height: auto;
    transition: transform 0.3s ease;
}

.button-container a img:hover {
    transform: scale(1.1);
}

@media (max-width: 480px) {
    .logo {
        left: 50%;
        width: 95%;
        height: 9vh;
    }

    .button-container {
        left: 50%;
    }

    .background {
        background-position: left;
    }
}
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="background"></div>
    </div>
    <img src="buttons/CClogo.png" class="logo">
    <div class="button-container">
        <div class="divtest">
            <div class="flex-container">
                <a href="updatelog.html"><img src="../buttons/updatelog.png"
                        alt="update log"></a>
            </div>
            <br><br>
            <div class="flex-container">
                <a href="visualdiary.html"><img src="../buttons/visualdiary.png"
                        alt="visual diary"></a>
            </div>
            <br><br>
            <div class="flex-container">
                <a href="tunes.html"><img src="../buttons/tunes.png"
                        alt="tunes"></a>
            </div>
            <br><br>
            <div class="flex-container">
                <a href="index.html"><img src="https://assets.propertyshelf.com/web-graphics/click-buttons/back-button.png/image"
                        alt="back"></a>
            </div>
        </div>
    </div> 
</body>
</html>
