<!DOCTYPE html>
<html lang="en">
<head>
  <title>CANINECRYPT // GALLERY</title>
  <meta charset="UTF-8">
  <link rel="icon" href="images/style/skullfavicon.png" type="image/gif">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap" rel="stylesheet">
</head>

<body>
  <style>
    body {
      background-color: #c0c0be;
    }

    p,
    h2,
    button-55 {
      margin: 15px;
      font-family: "Yatra One", system-ui;
      font-weight: 400;
      font-style: normal;
    }

    h2 {
      padding-top: 13px;
    }

    a {
      color: rgb(255, 255, 255);
      font-weight: bold;
      text-decoration-line: underline;
      text-decoration-color: rgb(0, 0, 0);
      text-decoration-style: wavy;
      text-shadow: #000000 1px 0 10px;
    }

    header {
      position: sticky;
      top: 0;
      background-color: #c0c0be;
      padding-bottom: 10px;
      width: 100%;
      margin: 0;
    }

    .preview {
      text-align: center;
      margin: 10px;
    }

    .img-container {
      padding: 15px;
      display: flex;
      /* shorthand for flex-direction and flex-wrap*/
      flex-flow: row wrap;
      justify-content: space-around;
      align-content: flex-start;
    }

    .content {
      /* should match box colour*/
      background-color: #c0c0be;
      display: grid;
      position: relative;
      padding-bottom: 50px;
      margin: auto;
    }

    .box {
      /*should match content colour*/
      background-color: #c0c0be;
      padding: 20px;
      text-align: center;
      padding-bottom: 0px;
    }

    .iframe {
      width: 90%;
      height: 500px;
      border: none;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-color: rgb(255, 78, 78) rgb(0, 0, 0);
    }

    /* width */
    ::-webkit-scrollbar {
      width: 10px;
    }

    /* Track */
    ::-webkit-scrollbar-track {
      box-shadow: inset 0 0 5px grey;
    }

    /* Handle */
    ::-webkit-scrollbar-thumb {
      background: rgb(0, 0, 0);
    }

    /* Handle on hover */
    ::-webkit-scrollbar-thumb:hover {
      background: #2e2e2e;
    }

    .button-55 {
      align-self: center;
      background-color: #de8392;
      background-image: none;
      background-position: 0 90%;
      background-repeat: repeat no-repeat;
      background-size: 4px 3px;
      border-radius: 15px 225px 255px 15px 15px 255px 225px 15px;
      border-style: solid;
      border-width: 2px;
      box-shadow: rgba(0, 0, 0, .2) 15px 28px 25px -18px;
      box-sizing: border-box;
      color: #41403e;
      cursor: pointer;
      display: inline-block;
      outline: none;
      padding: .75rem;
      text-decoration: none;
      transition: all 235ms ease-in-out;
      border-bottom-left-radius: 15px 255px;
      border-bottom-right-radius: 225px 15px;
      border-top-left-radius: 255px 15px;
      border-top-right-radius: 15px 225px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: "Yatra One", system-ui;
      font-weight: 400;
      font-style: normal;
    }

    .button-55:hover {
      box-shadow: rgba(0, 0, 0, .3) 2px 8px 8px -5px;
      transform: translate3d(0, 2px, 0);
    }

    .button-55:focus {
      box-shadow: rgba(0, 0, 0, .3) 2px 8px 4px -6px;
    }
  </style>
  <div class="content">
    <header>
      <br> <!-- leave this br in for equal spacing-->
      <div style="text-align: center;">
        <a href="index.html"><img src="buttons/CClogo.png" /></a>
      </div>
    </header>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const switchButton = document.getElementById('switchIframeButton');
        const iframes = document.querySelectorAll('iframe');
        let switched = false;

        // Set initial src based on data-original-src attribute
        iframes.forEach(iframe => {
          const originalSrc = iframe.getAttribute('data-original-src');
          iframe.setAttribute('src', originalSrc);  // Set initial source
        });

        switchButton.addEventListener('click', function () {
          iframes.forEach((iframe) => {
            const originalSrc = iframe.getAttribute('data-original-src');
            const altSrc = iframe.getAttribute('data-alt-src');

            // Toggle between original and alternate srcs
            iframe.setAttribute('src', switched ? originalSrc : altSrc);
          });

          switchButton.textContent = switched ? 'Toggle NSFW ON' : 'Toggle NSFW OFF';
          switched = !switched;
        });
      });
    </script>

    <div class="box">
      <button class="button-55" role="button" id="switchIframeButton">Toggle NSFW ON</button>
      <p><a href="index.html">&#x2190; go back home</a></p>

      <h2 id="#fullrender">Full Render</h2>

      <!-- Removed the `src` attribute, will be set by JS -->
      <iframe class="iframe" id="iframe1" data-original-src="gallery/fullrender.html" data-alt-src="gallery/fullrendernsfw.html"></iframe>
      <hr>
      <h2 id="#sketches">Sketches</h2>
      <iframe class="iframe" id="iframe2" data-original-src="gallery/sketch.html" data-alt-src="gallery/sketchnsfw.html"></iframe>
      <hr>
      <h2 id="#flatcolor">Flat Color</h2>
      <iframe class="iframe" data-original-src="gallery/flat.html" data-alt-src="gallery/flatnsfw.html"></iframe>
      <hr>
      <h2 id="#misc">Miscellaneous</h2>
      <iframe class="iframe" data-original-src="gallery/misc.html" data-alt-src="gallery/misc.html"></iframe>
    </div>
  </div>
</body>
</html>
